name: Publicar ICONIC GAME en GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - iconic-game-tele-voz.zip
      - index.html
      - .github/workflows/publish-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Extraer copia del juego
        run: |
          unzip -q iconic-game-tele-voz.zip -d site
          if [ -d site/iconic-game-tele-voz ]; then
            cp -a site/iconic-game-tele-voz/. site/
            rm -rf site/iconic-game-tele-voz
          fi
      - name: Cachear modelo español Vosk
        id: vosk-cache
        uses: actions/cache@v4
        with:
          path: /tmp/vosk-model-small-es-0.42.zip
          key: vosk-small-es-0.42-09b239888f633ef2f0b4e09736e3d9936acfd810bc65d53fad45261762c6511f
      - name: Descargar modelo español Vosk
        if: steps.vosk-cache.outputs.cache-hit != 'true'
        run: curl --fail --location --retry 3 --output /tmp/vosk-model-small-es-0.42.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
      - name: Comprobar e instalar modelo de voz local
        run: |
          echo '09b239888f633ef2f0b4e09736e3d9936acfd810bc65d53fad45261762c6511f  /tmp/vosk-model-small-es-0.42.zip' | sha256sum --check
          mkdir -p /tmp/vosk-es site/assets
          unzip -q /tmp/vosk-model-small-es-0.42.zip -d /tmp/vosk-es
          model_file="$(find /tmp/vosk-es -type f -name final.mdl -print -quit)"
          test -n "$model_file"
          model_dir="${model_file%/am/final.mdl}"
          test -s "$model_file"
          test -n "$(find "$model_dir" -type f -path '*/conf/mfcc*.conf' -print -quit)"
          test -s "$model_dir/graph/phones/word_boundary.int"
          if [ -s "$model_dir/graph/HCLr.fst" ]; then
            test -s "$model_dir/graph/Gr.fst"
          else
            test -s "$model_dir/graph/HCLG.fst"
          fi
          tar -czf site/assets/vosk-model-small-es-0.42.tar.gz -C "$model_dir" .
          printf '%s\n' 'Vosk Spanish small model vosk-model-small-es-0.42' 'Upstream: https://alphacephei.com/vosk/models' 'License: Apache-2.0' > site/assets/vosk-model-attribution.txt
          curl --fail --location --retry 3 --output site/assets/vosk-model-apache-2.0.txt https://www.apache.org/licenses/LICENSE-2.0.txt
      - name: Aplicar corrección de ruta y reconocimiento móvil
        run: cp index.html site/index.html
      - name: Subir sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
