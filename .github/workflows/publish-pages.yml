name: Publicar ICONIC GAME en GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - iconic-game-tele-voz.zip
      - index.html
      - .github/workflows/publish-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Extraer copia del juego
        run: unzip -q iconic-game-tele-voz.zip -d site
      - name: Aplicar corrección de ruta para GitHub Pages
        run: cp index.html site/index.html
      - name: Subir sitio estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
